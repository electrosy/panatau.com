<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panatau — Romania</title>
  <meta name="description" content="Pictures of Romania." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <p class="mark">panatau</p>
  </header>
  <main>
    <section class="intro">
      <h1>Romania</h1>
      <p class="lede">Pictures, not a catalog.</p>
    </section>
    <figure class="hero">
      <img src="images/carpathians.png" alt="Carpathian ridge and a still lake at dusk" />
      <figcaption>Carpathians</figcaption>
    </figure>
    <section class="gallery">
      <figure>
        <img src="images/painted-monastery.png" alt="Painted monastery wall in late light" />
        <figcaption>Painted monastery</figcaption>
      </figure>
      <figure>
        <img src="images/maramures.png" alt="Wooden church and carved gate in morning mist" />
        <figcaption>Maramureș</figcaption>
      </figure>
      <figure>
        <img src="images/sighisoara.png" alt="Quiet cobbled street toward a clock tower" />
        <figcaption>Sighișoara</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
